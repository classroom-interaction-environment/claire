<template name="rpCluster">
	{{#unless loadComplete}}
		{{> loading}}
	{{else}}

        {{!--
            the preview mode is a static, non-editable view of the cluster, where elements
            are placed in the same relative position as in edit mode, but without text --}}
		{{#unless edit}}
			<div class="w-100 preview-root">
				<div id="preview-parent" class="w-100 disable-cluster">
					<div id="cluster-preview-spawn" class="cluster-preview-spawn w-100">
						{{#each entry in values}}
							<span class="draggable cluster-preview-card border border-dark"
								  style="{{#with spawnPos @index}}left: {{this}}px;top: {{this}}px;{{/with}}background-color: {{#if entry.c}}{{entry.c}}{{else}}{{defaultBg}}{{/if}};"
								  id="{{entry.responseId}}"
								  data-x="{{spawnPos @index}}"
								  data-y="{{spawnPos @index}}">
					            {{! entry.response}}
				            </span>
						{{/each}}
					</div>
				</div>
			</div>
		{{/unless}}
	{{/unless}}

	<!-- content -->
	<div id="cluster-parent" class="cluster-parent bg-{{bg}} {{#if saving}}disable-cluster{{/if}}"
		 hidden="{{#unless edit}}hidden{{/unless}}">
		<!-- spawn area -->
		<div id="cluster-spawn" class="cluster-spawn">
			{{#each entry in values}}
					<div class="{{#unless isOptionTarget entry.responseId}}draggable{{/unless}} border border-dark text-container fit {{#if isCurrentDraggable entry.responseId}}shadow{{else}}shadow-sm{{/if}}"
						 style="{{#with spawnPos @index}}left: {{this}}px;top: {{this}}px;{{/with}}{{#if isOptionTarget entry.responseId}}position: absolute; z-index: 1250;{{/if}}"
						 id="{{entry.responseId}}"
                         data-id="{{entry.responseId}}"
						 data-x="{{spawnPos @index}}"
						 data-y="{{spawnPos @index}}">
                            <div class="text-entry" data-id="{{entry.responseId}}">
                                <span class="text no-select break-only-space" style="font-size: {{fontSize}}px !important;">{{entry.response}}{{entry.c}}</span>
								{{#if isOptionTarget entry.responseId}}
									<div class="entry-options block border-top bg-light p-2 mt-2 text-left">
										<span class="fw-semibold">Color</span>
										<input type="color"
											   id="color-input"
											   data-element="{{entry.responseId}}"
											   value="{{color entry.responseId}}">
									</div>
								{{/if}}
                            </div>
					</div>

			{{/each}}
		</div>

		<div class="top-right">
			<div class="d-flex gap-2 justify-content-between align-items-center">
				{{#if saving}}
					{{> icon fw=true spin=true name="sync"}}
					<span>{{i18n "actions.saving"}}</span>
				{{/if}}
			<div class="d-flex align-items-center gap-2">
				{{> icon name="font"}}
				<label for="font-size-range">{{fontSize}}px</label>
				<input type="range" step="1" min="12" max="128" value="{{fontSize}}" class="form-range"
					   id="font-size-range" title="{{i18n 'rpCluster.fontSizeTitle'}}">
			</div>
			<button type="button" class="btn btn-outline-secondary" id="reset-artifacts-button">
				<i class="fa fa-fw fa-bolt"></i> {{i18n 'actions.reset'}}
			</button>
			<button type="button" class="btn btn-primary edit-mode-button">
				{{i18n "common.complete"}}
			</button>
				</div>
		</div>
	</div>
</template>
