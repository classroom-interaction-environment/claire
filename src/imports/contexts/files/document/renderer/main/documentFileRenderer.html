<template name="documentFileRenderer">
  <div class="w-100 text-center">
    <div class="py-2">{{file.name}}</div>
    <div class="pdf-target"></div>
      {{#unless rendered}}
          {{#if hasThumbnail file}}
            <div>
                {{> image src=(getThumbnail file) class="border border-light"}}
            </div>
          {{/if}}
      {{/unless}}
      {{> downloadButton inBrowser=true collection=collectionName file=file showLabel=true showSize=true}}
  </div>
</template>
