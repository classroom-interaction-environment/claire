<template name="taskEditor">
    {{#unless loadComplete}}
        {{> loading type="data"}}
    {{else}}

        {{#unless hideHeader}}
            {{#routeInfo}}
                {{> actionButton icon="circle-question"
                        type="outline-secondary"
                        class="mb-3 float-end te-help-btn"
                        title=(i18n "common.help")}}
              <div class="d-flex justify-content-between w-100">
                  {{! pocket info}}
                  {{#with unitDoc}}
                    <div class="fw-light my-2 w-100 text-center text-md-start">
                        {{> link href=(route "unitEditor" unitDoc._id 'material' 'tasks' task._id) class="border-0" icon="caret-left" label=(i18n "editor.task.backToUnit")}}
                    </div>
                  {{/with}}
                  {{#with getTaskDoc}}
                    <div class="text-center text-md-end">
                      <h4>{{getTaskDoc.title}}</h4>
                        {{> documentState document=getTaskDoc}}

                        {{#if unitDoc}}
                          <div class="text-muted fw-light my-2 w-100 text-center text-md-end">
                            <span>{{i18n "curriculum.unit"}}</span>
                            <span>"{{unitDoc.title}}"</span>
                          </div>
                        {{/if}}

                        {{#if pocketDoc}}
                          <div class="text-muted fw-light my-2 w-100 text-center text-md-end">
                            <span>{{i18n "curriculum.pocket"}}</span>
                            <span>"{{pocketDoc.title}}"</span>
                          </div>
                        {{/if}}
                    </div>
                  {{/with}}
              </div>
            {{/routeInfo}}
        {{/unless}}
        {{! navbar }}
        {{> submenu submenuData}}

        {{! current view }}
        <div class="te-{{currentViewName}} w-100">
            {{> TemplateLoader currentView}}
        </div>

        {{!link to current unit in unit editor }}
        {{#with unitDoc}}
          <div class="d-block text-center">
              {{> routeButton
                      class="to-unit-editor-btn"
                      href=(join "" (route "unitEditor" this._id) "?tab=material")
                      label=(i18n "editor.task.backToUnit")
                      title=unitDoc.title
                      icon="caret-left" }}
          </div>
        {{/with}}
    {{/unless}}
</template>
