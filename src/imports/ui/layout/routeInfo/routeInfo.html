<template name="routeInfo">
  <div class="w-100 p-0 py-sm-1 py-md-3 py-lg-4 nav-route-info d-print-none clearfix">
      {{#with routeTitle}}
        <h1 class="text-primary text-center text-md-start float-start">
            {{#if i18nInitialized}}
                {{i18n this}}
            {{else}}
                {{this}}
            {{/if}}
        </h1>
      {{/with}}
      {{!--
          <div class="row  d-flex">
              <div class="col-xs-12 col-sm-12 col-md-6">
                  {{#with ref}}
                      <span class="ms-auto">
                          <a href="{{this.value}}">
                              <i class="fa fa-fw fa-caret-left"></i>
                              {{i18n 'routes.backToEdit'}}: {{i18n this.label}}
                          </a>
                      </span>
                  {{/with}}
              </div>
          </div>
      --}}
      {{> Template.contentBlock}}
  </div>
</template>
